# main에 앱 변경이 머지되면 macOS 러너에서 iOS를 빌드해 테스트플라이트에 올린다.
# 로컬 릴리스와 같은 fastlane 경로(expo prebuild → xcodebuild)를 쓰고, EAS는 쓰지 않는다.
# 필요한 저장소 Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD (app/fastlane/SETUP.md 참고)
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

# main 에 연달아 머지해도 마지막 머지만 빌드한다.
# 1) wait: 머지 뒤 5분 기다린다. 그 사이 새 머지가 오면 기다리던 run 은 취소되고(빌드 안 함) 새 run 이 다시 기다린다.
# 2) build: 빌드·업로드 중인 run 은 취소하지 않는다(업로드 도중 끊기면 빌드 번호가 꼬일 수 있어서).
#    빌드 중에 새 머지가 오면 그 run 은 대기하고, 대기 중인 run 은 더 새 run 이 오면 GitHub 이 취소한다.
#    그래서 빌드는 많아야 "지금 도는 것 + 가장 최근 것" 두 번만 돈다.
# 수동 실행(workflow_dispatch)은 기다리지 않는다.
jobs:
  wait:
    runs-on: ubuntu-latest
    concurrency:
      group: testflight-wait
      cancel-in-progress: true
    steps:
      - name: 연속 머지 모으기 (5분)
        if: github.event_name == 'push'
        run: sleep 300

  build:
    needs: wait
    runs-on: macos-26
    concurrency:
      group: testflight
      cancel-in-progress: false
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APPLE_TEAM_ID: 25KGF8Y83H
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: app

      - run: npm ci

      - name: 검사
        run: |
          npx tsc --noEmit
          npm run verify:engine
          npm run test:ads
          npx tsx scripts/test-live-activity.ts

      - name: 서명 키 준비
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        # runner 컨텍스트는 job env에서 못 쓰므로 경로는 여기서 정해 넘긴다
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          IOS_DIST_CERT_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$IOS_DIST_CERT_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          echo "IOS_DIST_CERT_PATH=$IOS_DIST_CERT_PATH" >> "$GITHUB_ENV"

      - name: 빌드 + 테스트플라이트 업로드
        run: bundle exec fastlane ios ci_beta
